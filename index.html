<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我該去哪裡</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <!-- Shown until a Google Maps API key is saved -->
    <section id="key-setup" class="key-setup" hidden>
      <h1>我該去哪裡</h1>
      <p>找出彼此距離相近的地點，讓你不必跑太遠就能到下一站。</p>
      <form id="key-form">
        <label for="key-input">Google Maps API 金鑰</label>
        <input id="key-input" type="password" placeholder="AIza..." required autocomplete="off" />
        <button type="submit">儲存並開始</button>
      </form>
      <p class="hint">
        金鑰只會儲存在這個瀏覽器（localStorage）。需要啟用 <b>Maps JavaScript API</b> 和
        <b>Places API (New)</b>，設定步驟請見 README。
      </p>
    </section>

    <main id="app" class="app" hidden>
      <aside class="panel">
        <header class="panel-head">
          <h1>我該去哪裡</h1>
          <button id="change-key" class="link" type="button">更換 API 金鑰</button>
        </header>

        <div class="settings">
          <label>
            交通方式
            <select id="travel-mode">
              <option value="walking">步行</option>
              <option value="driving">開車</option>
              <option value="transit">大眾運輸</option>
              <option value="bicycling">騎自行車</option>
            </select>
          </label>
          <label>
            單位
            <select id="units">
              <option value="km">公里</option>
              <option value="mi">英里</option>
            </select>
          </label>
        </div>

        <div class="field">
          <label>起點 <span class="muted">（選填，例如你的飯店）</span></label>
          <div id="start-slot" class="ac-slot"></div>
          <div id="start-chip" class="chip" hidden></div>
        </div>

        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="combo" role="tab">找附近的組合</button>
          <button class="tab" data-tab="stops" role="tab">規劃我的行程</button>
        </nav>

        <!-- Mode 1: search several things, pick one of each that are close together -->
        <section id="tab-combo" class="tab-body">
          <p class="muted">
            搜尋幾種不同類型的地點，我們會從每一類各挑一個，找出彼此最接近的組合。
            搜尋結果以地圖目前顯示的範圍為主。
          </p>
          <form id="search-form" class="row">
            <input id="search-input" placeholder="例如：拉麵、書店、全聯" autocomplete="off" />
            <button type="submit">加入</button>
          </form>
          <ul id="search-list" class="list"></ul>
          <button id="find-combos" class="primary" type="button" disabled>找出最近的組合</button>
          <div id="combo-results"></div>
        </section>

        <!-- Mode 2: places already chosen, find the shortest order -->
        <section id="tab-stops" class="tab-body" hidden>
          <p class="muted">加入你想去的特定地點，我們會找出移動距離最短的順序。</p>
          <div id="stop-slot" class="ac-slot"></div>
          <ul id="stop-list" class="list"></ul>
          <button id="plan-route" class="primary" type="button" disabled>規劃最短路線</button>
          <div id="route-results"></div>
        </section>

        <p id="status" class="status" role="status"></p>
        <p class="footnote">
          距離為直線估算，僅用於排序。點「在 Google 地圖中開啟」可取得實際路線。
        </p>
      </aside>

      <div id="map" class="map"></div>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
